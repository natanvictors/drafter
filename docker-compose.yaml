name: docker-drafter
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: drafter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: whateva
    ports:
      - "65432:5432"
    volumes:
      - drafter_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
  drafter:
    build: .
    container_name: drafter
    restart: unless-stopped
    environment:
      - DB_URL=postgresql://postgres:whateva@postgres:5432/drafter?sslmode=disable
    env_file: .env
volumes:
  drafter_postgres_data:
